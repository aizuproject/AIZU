name: AIZU
options:
  developmentLanguage: en
  bundleIdPrefix: app.aizuproject
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AIZU:
    type: application
    platform: iOS
    sources:
      - path: iPadPresence
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aizuproject.aizu
        PRODUCT_NAME: AIZU
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPadPresence/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: iPadPresence/Integration/DiscordBridge.h
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
  iPadPresenceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iPadPresenceTests]
    dependencies:
      - target: AIZU
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/AIZU.app/AIZU'
        BUNDLE_LOADER: '$(TEST_HOST)'
  iPadPresenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iPadPresenceUITests]
    dependencies:
      - target: AIZU
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIZU:
    build:
      targets:
        AIZU: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iPadPresenceTests
        - iPadPresenceUITests
      gatherCoverageData: true
